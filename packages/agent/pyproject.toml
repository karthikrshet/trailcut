[project]
name = "trailcut-agent"
version = "0.0.0"
description = "TrailCut Claude tool-calling agents and the numeric-claim response validator."
requires-python = ">=3.12,<3.13"
dependencies = [
  "trailcut-engine",
  "trailcut-ingest",  # PII masking before any text reaches the model
  "pydantic>=2.10",
  "anthropic>=2.12.0",  # official Claude SDK for the chat agents
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trailcut_agent"]
