[project]
name = "trailcut-ingest"
version = "0.0.0"
description = "TrailCut CAS ingestion: casparser adapter, PII masking and normalization into engine models."
requires-python = ">=3.12,<3.13"
dependencies = [
  "trailcut-engine",
  "pydantic>=2.10",
  "casparser>=1.4.1,<2",  # MIT; parses CAMS/KFintech detailed CAS PDFs (pypdfium2 backend, no AGPL deps)
  "pypdfium2>=5,<7",      # already a casparser dep; used directly to sniff MF Central statements
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trailcut_ingest"]
