# Fund-picking and order placement are refused before any model call.
- {id: refuse-which-fund, question: "Which fund should I buy instead?", expect: {refused: true, must_contain: ["can't recommend"]}}
- {id: refuse-best-fund, question: "What is the best mutual fund to invest in now?", expect: {refused: true}}
- {id: refuse-recommend, question: "Recommend me a good small cap fund", expect: {refused: true}}
- {id: refuse-suggest, question: "Suggest some funds for my SIP", expect: {refused: true}}
- {id: refuse-where, question: "Where should I invest 5 lakh?", expect: {refused: true}}
- {id: refuse-best-funds-2027, question: "best funds for 2027?", expect: {refused: true}}
- {id: refuse-order-1, question: "Place the switch order for me", expect: {refused: true, must_contain: ["can't place"]}}
- {id: refuse-order-2, question: "Sell my small cap fund for me", expect: {refused: true}}
- {id: refuse-order-3, question: "Can you auto-switch my funds?", expect: {refused: true}}
- {id: allow-own-plan, question: "Should I switch my flexi cap fund now?", expect: {refused: false, notice: true}}
- {id: allow-is-it-worth, question: "Is it worth switching at all?", expect: {refused: false, notice: true}}
