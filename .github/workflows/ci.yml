name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "true"
  HYPOTHESIS_PROFILE: ci
  UV_FROZEN: "1"

jobs:
  lint-types:
    name: 1 · Lint + types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: uv sync
      - run: pnpm install --frozen-lockfile
      - name: ruff, mypy --strict, eslint, tsc
        run: uv run python scripts/dev.py check

  unit-property:
    name: 2 · Unit + property (engine coverage ≥ 90%)
    needs: lint-types
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync
      - name: pytest + Hypothesis with coverage gate
        run: uv run python scripts/dev.py test-unit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-coverage
          path: coverage.xml
          if-no-files-found: ignore

  api-web:
    name: 3 · API + web
    needs: unit-property
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: uv sync
      - run: pnpm install --frozen-lockfile
      - name: FastAPI tests
        run: uv run python scripts/dev.py test-api
      - name: Vitest
        run: uv run python scripts/dev.py test-web
      - name: Production build
        run: pnpm --filter web build

  e2e:
    name: 4 · Playwright E2E
    needs: api-web
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: uv sync
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Playwright against the real API (desktop + 375px)
        run: uv run python scripts/dev.py e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  docker:
    name: 5 · Docker image
    needs: api-web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t trailcut-api:ci .
      - name: Smoke-test the container
        run: |
          docker run -d --name api -p 8000:8000 trailcut-api:ci
          for i in $(seq 1 30); do curl -fsS localhost:8000/health && break; sleep 1; done
          curl -fsS localhost:8000/health
          curl -fsS -X POST localhost:8000/v1/sessions/sample > /dev/null
          docker inspect --format '{{.Config.User}}' api | grep -qx trailcut
