[project]
name = "trailcut-api"
version = "0.0.0"
description = "TrailCut HTTP API (FastAPI)."
requires-python = ">=3.12,<3.13"
dependencies = [
  "trailcut-engine",
  "trailcut-agent",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.10",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trailcut_api"]
